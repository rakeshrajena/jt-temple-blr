  --focus: #7fb0ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --maroon: #e8a49a; --maroon-dark: #f3c2b9; --saffron: #f0a050; --turmeric: #f2c650;

          '<div class="field"><label for="vref">Reference / UTR</label><input id="vref" value="' + esc(S.utr || '') + '"></div><div class="field"><label for="vamt">Amount received (₹)</label><input id="vamt" value="' + (total() / 100).toFixed(2) + '"></div><button class="btn btn-primary" type="button" id="verify">Confirm payment verified</button></div></details>'
          : '<div class="alert a-ok">Payment verified. The devotee was notified on WhatsApp and the booking is confirmed.</div>') +
        '<details class="action"><summary>Reschedule</summary><div class="inner"><p class="small">Choose a new date and time; capacity is checked and the devotee is notified.</p></div></details><details class="action"><summary>Cancel booking</summary><div class="inner"><p class="small">A reason is required and sent to the devotee.</p></div></details><details class="action"><summary>Add internal note</summary><div class="inner"><p class="small">Visible only to staff, kept in the history.</p></div></details></section></div>' +
        '<section class="card stack"><h2>History</h2><div class="tbl-wrap"><table><thead><tr><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>' + (S.payment === 'paid' ? '<tr><td>admin:temple</td><td>payment.verified</td><td>reference ' + esc(S.utr) + ', amount ' + rs(total()) + '</td></tr>' : '') + (S.utr ? '<tr><td>devotee</td><td>payment.submitted</td><td>reference ' + esc(S.utr) + '</td></tr>' : '') + '<tr><td>devotee</td><td>booking.created</td><td>total ' + rs(total()) + '</td></tr></tbody></table></div></section></div>';
    }
  };
  function badgePay() { return { pending: '<span class="badge b-warn">Payment pending</span>', awaiting: '<span class="badge b-warn">Awaiting verification</span>', paid: '<span class="badge b-ok">Paid (verified)</span>' }[S.payment]; }
  function inp(key, label, req, type, hint) {
    return '<div class="field"><label for="i_' + key + '">' + label + ' ' + (req ? '<span class="req">(required)</span>' : '<span class="opt-l">(optional)</span>') + '</label><input id="i_' + key + '" type="' + type + '" data-bind="' + key + '" value="' + esc(S[key]) + '">' + (hint ? '<span class="small muted">' + hint + '</span>' : '') + '</div>';
  }
  function waOptHtml() {
    var n = waNumber(S.mobile);
    if (!n) return S.mobile.trim() ? '<p class="small muted">Enter a 10-digit mobile number to receive the booking on WhatsApp.</p>' : '';
    return '<label class="opt wa-opt"><input type="checkbox" id="waOptIn"' + (S.waOptIn ? ' checked' : '') + '><span><strong>Send my booking details to WhatsApp ' + fmtWa(n) + '</strong><span class="opt-d">Booking number, services, date, amount and payment details. The temple office is also informed of your booking.</span></span></label>';
  }
  function bookingSummary() {
    var svcs = S.sel.map(function (id) { return svc(id).name; }).join(', ');
    var when = fdate(S.date) + ', ' + S.sel.map(function (id) { return svc(id).slots[S.slot[id] || 0]; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join('; ');
    var food = items().filter(function (i) { return i.food; }).map(function (i) { return i.name + ' × ' + i.qty; }).join(', ') || 'None';
    return { svcs: svcs, when: when, food: food };
  }
  function statusText() { return S.status === 'confirmed' ? 'Confirmed' : S.payment === 'awaiting' ? 'Payment submitted, awaiting verification' : S.payment === 'paid' ? 'Paid' : 'Booking request received, payment pending'; }
  function msgDevotee() {
    var b = bookingSummary();
    return '🙏 Jai Jagannath, ' + S.name + '.\n\nYour booking request ' + S.booking + ' at Shree Jagannatha Temple Bengaluru has been received.\n\nServices: ' + b.svcs +
      '\nDate and time: ' + b.when + '\nFood / prasadam: ' + b.food + '\nTotal amount: ' + rs(total()) + '\nStatus: ' + statusText() +
      '\n\nPay by UPI to ' + UPI_ID + ' (note: ' + S.booking + ') and share the UTR.\nPlease quote your booking number in all communication.';
  }
  function msgAdmin() {
    var b = bookingSummary();
    return (S.utr ? 'Payment reference submitted for booking ' + S.booking + '. UTR: ' + S.utr + '\n\n' : '') + 'New temple booking ' + S.booking + '\n\nDevotee: ' + S.name + ' (' + fmtWa(waNumber(S.mobile)) + ')\nServices: ' + b.svcs +
      '\nDate and time: ' + b.when + '\nFood / prasadam: ' + b.food + '\nTotal: ' + rs(total()) + '\nStatus: ' + statusText() + '\n\nPlease check the bank statement before marking it paid.';
  }
  function waLink(num, text) { return 'https://wa.me/' + num + '?text=' + encodeURIComponent(text); }
  function adminLinkHtml() {
    var n = waNumber(S.adminWa);
    return n ? '<a id="adminWaLink" class="btn btn-wa" href="' + esc(waLink(n, msgAdmin())) + '" target="_blank" rel="noopener">Send to temple admin ' + fmtWa(n) + '</a>'
             : '<span id="adminWaLink" class="small muted">Enter the admin\'s WhatsApp number to enable this button.</span>';
  }
  function waCard() {
    var dev = waNumber(S.mobile);
    return '<section class="card stack"><div class="pay-head"><h2>WhatsApp notifications</h2><span class="badge b-info">Automatic in the live system</span></div>' +
      '<p class="small muted">In the live system both messages are sent automatically through the WhatsApp Business API as soon as the booking is saved. This preview cannot send by itself, so each button opens WhatsApp with the message ready; press send there.</p>' +
      '<div class="cols"><div class="stack"><h3>To the devotee' + (dev ? ' · ' + fmtWa(dev) : '') + '</h3><pre class="wa-bubble">' + esc(msgDevotee()) + '</pre>' +
        (S.waOptIn && dev ? '<a class="btn btn-wa" href="' + esc(waLink(dev, msgDevotee())) + '" target="_blank" rel="noopener">Send to devotee on WhatsApp</a>' : '<p class="small muted">WhatsApp updates were switched off for this booking.</p>') + '</div>' +
      '<div class="stack"><h3>To the temple admin</h3><pre class="wa-bubble">' + esc(msgAdmin()) + '</pre>' +
        '<div class="field"><label for="adminWa">Admin WhatsApp number</label><input id="adminWa" type="tel" placeholder="98450 00000" value="' + esc(S.adminWa) + '"><span class="small muted">Remembered in this browser only.</span></div>' + adminLinkHtml() + '</div></div></section>';
  }
  function err() { var e = S.errors; return e.length ? '<div class="alert a-bad" role="alert">' + e.map(esc).join('<br>') + '</div>' : ''; }

  var JUMPS = [['home', 'Home'], ['book1', '1 Service'], ['book2', '2 Details'], ['book3', '3 Prasadam'], ['review', '4 Review'], ['pay', '5 Pay'], ['status', '6 Done'], ['invoice', 'Invoice'], ['lookup', 'Find booking'], ['admin', 'Admin'], ['adminBooking', 'Admin: verify']];
  function render(focus) {
    var admin = S.screen.indexOf('admin') === 0;
    $('#pub-head').hidden = admin; $('#adm-head').hidden = !admin;
    $('#app').innerHTML = '<div class="screen ' + (['book1', 'book2', 'book3', 'review', 'pay', 'status', 'invoice', 'lookup'].indexOf(S.screen) >= 0 ? 'narrow' : '') + '">' + screens[S.screen]() + '</div>';
    $('#jump').innerHTML = JUMPS.map(function (j) { return '<button type="button" data-go="' + j[0] + '" aria-pressed="' + (S.screen === j[0]) + '">' + j[1] + '</button>'; }).join('');
    if (focus) window.scrollTo({ top: 0 });
  }
  function go(s) { S.screen = s; S.errors = []; render(true); }

  function validate(step) {
    var e = [];
    if (step === 'book2' && !S.sel.length) e.push('Please choose at least one service.');
    if (step === 'book3') {
      if (S.name.trim().length < 2) e.push('Please enter your full name.');
      if (!waNumber(S.mobile)) e.push(S.mobile.trim() ? 'Please enter a valid 10-digit mobile number.' : 'Mobile number is required. Your booking details are sent to it on WhatsApp.');
      if (!S.date) e.push('Please choose a date.');
      S.sel.forEach(function (id) { (svc(id).fields || []).forEach(function (f, i) { if (f[1] && !((S.fields[id] || [])[i] || '').trim()) e.push(f[0] + ' is required for ' + svc(id).name + '.'); }); });
    }
    if (step === 'review' && (foodOnly() || S.addFood) && !COUPONS.some(function (c) { return S.qty[c.id] > 0; }))
      e.push(foodOnly() ? 'Please choose at least one item and enter the quantity.' : 'Choose a food item and quantity, or untick "Add Food".');
    return e;
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, input');
    if (!t) return;
    if (t.dataset.go) { if (t.dataset.go === 'pay' && !S.booking) ensureBooking(); go(t.dataset.go); }
    else if (t.dataset.pick) { S.sel = [+t.dataset.pick]; if (svc(+t.dataset.pick).foodOnly) S.addFood = false; go('book1'); }
    else if (t.dataset.next) { var e = validate(t.dataset.next); if (e.length) { S.errors = e; render(); } else go(t.dataset.next); }
    else if (t.dataset.inc || t.dataset.dec) { var id = +(t.dataset.inc || t.dataset.dec); S.qty[id] = Math.max(0, Math.min(200, (S.qty[id] || 0) + (t.dataset.inc ? 1 : -1))); render(); }
    else if (t.dataset.copy) { var b = t; try { navigator.clipboard.writeText(b.dataset.copy).then(function () { b.textContent = 'Copied ✓'; }, function () {}); } catch (x) {} }
    else if (t.id === 'submitBooking') { if (!$('#agree').checked) { S.errors = ['Please tick the box to confirm the details are correct.']; render(); return; } S.booking = null; S.payment = 'pending'; S.status = 'pending'; S.utr = ''; ensureBooking(); go('pay'); }
    else if (t.id === 'verify') { S.utr = S.utr || $('#vref').value || '427812345678'; S.payment = 'paid'; S.status = S.sel.some(function (id) { return svc(id).approval; }) ? 'pending' : 'confirmed'; render(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.dataset.svc) {
      var id = +t.dataset.svc, s = svc(id);
      if (t.checked) { S.sel = S.sel.filter(function (o) { return !(s.foodOnly || svc(o).foodOnly); }); S.sel.push(id); }
      else S.sel = S.sel.filter(function (o) { return o !== id; });
      render();
    } else if (t.id === 'waOptIn') { S.waOptIn = t.checked; }
    else if (t.id === 'addFood') { S.addFood = t.checked; render(); }
    else if (t.dataset.cchk) { var c = +t.dataset.cchk; S.qty[c] = t.checked ? (S.qty[c] || 1) : 0; render(); }
    else if (t.dataset.slot) S.slot[+t.dataset.slot] = +t.value;
    else if (t.dataset.qty) { S.qty[+t.dataset.qty] = Math.max(0, Math.min(200, parseInt(t.value, 10) || 0)); render(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.dataset.bind) { S[t.dataset.bind] = t.value; if (t.dataset.bind === 'mobile' && $('#waOpt')) $('#waOpt').innerHTML = waOptHtml(); }
    else if (t.id === 'adminWa') { S.adminWa = t.value; saveAdmin(t.value); var w = $('#adminWaLink'); if (w) w.outerHTML = adminLinkHtml(); }
    else if (t.dataset.part) S.participants[+t.dataset.part] = t.value;
    else if (t.dataset.field) { var p = t.dataset.field.split(':'); (S.fields[p[0]] = S.fields[p[0]] || [])[+p[1]] = t.value; }
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'utrForm') {
      var v = $('#utr').value.replace(/\s/g, '');
      if (!/^[A-Za-z0-9]{6,35}$/.test(v)) { S.errors = ['Please enter the UPI reference / UTR exactly as shown in your UPI app (usually 12 digits).']; render(); return; }
      S.utr = v; S.payment = 'awaiting'; go('status');
    } else if (ev.target.id === 'lookupForm') { ensureBooking(); go('status'); }
  });
  render();
})();
</script>

</body></html>
